<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #0d0e12;
        display: flex;
        flex-direction: column; /* Вертикальное выравнивание */
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #0d0e12;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Сдвигаем всё чуть выше (позиция 2) */
        justify-content: flex-start; 
        padding-top: 20vh; /* Отступ сверху */
        z-index: 9999;
    }

    .logo-container {
        /* Размер С - более крупный и заметный */
        width: 220px; 
        height: 220px;
        background-image: url('logo.jpg');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
    }

    .app-name {
        margin-top: 25px;
        font-family: sans-serif;
        font-size: 28px;
        color: #ffffff;
        letter-spacing: 4px;
        font-weight: bold;
        text-transform: uppercase;
    }
</style>

<div id="splash-screen">
    <div class="logo-container"></div>
    <div class="app-name">ArmGift</div>
</div>
